            - OUTSIDE_PARENT_SCOPE
            - SELLER_POLICY_DENIED
            - GRANT_REVOKED
            - GRANT_EXPIRED
            - BUDGET_EXCEEDED
            - QUOTE_EXPIRED
            - INVALID_CALLER
            - INVALID_REQUEST
            - ALREADY_EXECUTED
            - SERVICE_UNAVAILABLE
    LatestResult:
      type: object
      additionalProperties: false
      required:
        - timestamp
        - action
        - decision
        - reason_code
        - grant_id
      properties:
        timestamp:
          type: string
          format: date-time
        action:
          type: string
        decision:
          type: string
        reason_code:
          anyOf:
            - $ref: '#/components/schemas/ErrorCode'
            - type: 'null'
        grant_id:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 200
            - type: 'null'
    Inspector:
      type: object
      additionalProperties: false
      required:
        - budgets
        - latest_result
      properties:
        budgets:
          type: array
          items:
            $ref: '#/components/schemas/GrantBudget'
        latest_result:
          anyOf:
            - $ref: '#/components/schemas/LatestResult'
            - type: 'null'
    Caller:
      type: object
      additionalProperties: false
      required:
        - principal_id
        - organization_id
        - role
        - grants
        - inspector
      properties:
        principal_id:
          type: string
          minLength: 1
          maxLength: 200
        organization_id:
          type: string
          minLength: 1
          maxLength: 200
        role:
          type: string
          enum:
            - OWNER
            - BUYER
            - SOURCING
            - SUPPLIER
            - SERVICE
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
        inspector:
          $ref: '#/components/schemas/Inspector'
    AuthorityRequest:
      type: object
      additionalProperties: false
      required:
        - id
        - requester_principal_id
        - parent_grant_id
        - requested_scope
        - reason
        - status
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 200
        requester_principal_id:
          type: string
          minLength: 1
          maxLength: 200
        parent_grant_id:
          type: string
          minLength: 1
          maxLength: 200
        requested_scope:
          $ref: '#/components/schemas/AuthorityScope'
        offered_scope:
          $ref: '#/components/schemas/AuthorityScope'
        reason:
          type: string
        status:
          type: string
          enum:
            - PENDING
            - COUNTEROFFERED
            - ACCEPTED
            - REJECTED
            - CANCELLED
        issued_grant_id:
          type: string
          minLength: 1
          maxLength: 200
    AuthorityRequestInput:
      type: object
      additionalProperties: false
      required:
        - parent_grant_id
        - requested_scope
        - reason
      properties:
        parent_grant_id:
          type: string
          minLength: 1
          maxLength: 200
        requested_scope:
          $ref: '#/components/schemas/AuthorityScope'
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      examples:
        - parent_grant_id: grant-root-buyer
          requested_scope:
            actions:
              - supplier.quote.request
              - supplier.purchase.execute
            supplier_ids:
              - supplier-co
            sku_ids:
              - PACK-500
            max_per_action_cents: 90000
            total_budget_cents: 90000
            expires_at: '2026-10-18T17:30:00Z'
            max_delegation_depth: 0
          reason: Purchase the trusted packaging quote
    AuthorityRequestCreated:
      type: object
      additionalProperties: false
      required:
        - request_id
        - status
      properties:
        request_id:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          const: PENDING
    AuthorityResponseInput:
      type: object
      additionalProperties: false
      required:
        - decision
      properties:
        decision:
          type: string
          enum:
            - COUNTEROFFER
            - REJECT
        offered_scope:
          $ref: '#/components/schemas/AuthorityScope'
      allOf:
        - if:
            properties:
              decision:
                const: COUNTEROFFER
          then:
            required:
              - offered_scope
    IdempotencyInput:
      type: object
      additionalProperties: false
      required:
        - idempotency_key
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 200
    DelegateInput:
      type: object
      additionalProperties: false
      required:
        - recipient_principal_id
        - scope
      properties:
        recipient_principal_id:
          type: string
          minLength: 1
          maxLength: 200
        scope:
          $ref: '#/components/schemas/AuthorityScope'
    ProvisionChildInput:
      type: object
      additionalProperties: false
      required:
        - scope
        - credential_hash
        - idempotency_key
      properties:
        scope:
          $ref: '#/components/schemas/AuthorityScope'
        credential_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: SHA-256 verifier of a locally generated 256-bit child secret. Never send the raw secret.
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 200
    ProvisionedChild:
      type: object
      additionalProperties: false
      required:
        - principal
        - grant
      properties:
        principal:
          $ref: '#/components/schemas/Principal'
        grant:
          $ref: '#/components/schemas/Grant'
    RevokeGrantInput:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    GrantRevocation:
      type: object
      additionalProperties: false
      required:
        - grant_id
        - revoked_at
      properties:
        grant_id:
          type: string
          minLength: 1
          maxLength: 200
        revoked_at:
          type: string
          format: date-time
    ExecuteActionInput:
      type: object
      additionalProperties: false
      required:
        - grant_id
        - action
        - supplier_id
        - sku_id
        - idempotency_key
      properties:
        grant_id:
          type: string
          minLength: 1
          maxLength: 200
        action:
          $ref: '#/components/schemas/AgentAction'
        supplier_id:
          type: string
          minLength: 1
          maxLength: 200
        sku_id:
          type: string
          minLength: 1
          maxLength: 200
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
        quote_id:
          type: string
          minLength: 1
          maxLength: 200
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 200
      allOf:
        - if:
            properties:
              action:
                const: supplier.quote.request
          then:
            required:
              - quantity
            not:
              required:
                - quote_id
        - if:
            properties:
              action:
                const: supplier.purchase.execute
          then:
            required:
              - quote_id
      description: >-
        Quote requires quantity and forbids quote_id. Purchase requires quote_id; authoritative
        quote determines amount and quantity. No caller-supplied price.
      examples:
        - grant_id: grant-quote
          action: supplier.quote.request
          supplier_id: supplier-co
          sku_id: PACK-500
          quantity: 500
          idempotency_key: quote-001
        - grant_id: grant-purchase
          action: supplier.purchase.execute
          supplier_id: supplier-co
          sku_id: PACK-500
          quote_id: quote-001
          idempotency_key: purchase-001
    SupplierQuote:
      type: object
