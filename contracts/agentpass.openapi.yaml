components:
  securitySchemes:
    AgentBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-agent-key
      description: >-
        Unique provisioned agent credential. Bound child keys are rechecked against their original
        grant chain on every authentication.
    HumanBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Verified Supabase OAuth access token for the canonical MCP resource and allowlisted client.
        Available only when configured. Ingress derives account, workspace and connection; token
        refresh grants no new authority.
    RunnerBearer:
      type: http
      scheme: bearer
      bearerFormat: trusted-runner-key
      description: >-
        Separate operator-admitted runner key, matched to permitted organizations or trusted
        workspace assignment. An agent key is insufficient.
    SupplierServiceKey:
      type: apiKey
      in: header
      name: X-Service-Key
      description: Private authority-to-supplier service credential; never send to a model or browser.
    ConsoleCookie:
      type: apiKey
      in: cookie
      name: agentpass_session
      description: >-
        Opaque HttpOnly SameSite=Strict cookie, Secure over HTTPS. Server session holds the
        credential for at most one hour, process-local.
    ConsentCookie:
      type: apiKey
      in: cookie
      name: agentpass_consent
      description: HttpOnly Secure SameSite=Lax one-use consent session; five-minute lifetime.
    IdentityCookie:
      type: apiKey
      in: cookie
      name: agentpass_identity
      description: HttpOnly Secure one-use identity session; tokens remain encrypted server-side.
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 200
    Money:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    AgentAction:
      type: string
      enum:
        - supplier.quote.request
        - supplier.purchase.execute
        - supplier.margin.read
    AuthorityScope:
      type: object
      properties:
        actions:
          maxItems: 3
          type: array
          items:
            type: string
            enum:
              - supplier.quote.request
              - supplier.purchase.execute
              - supplier.margin.read
        supplier_ids:
          maxItems: 100
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
        sku_ids:
          maxItems: 100
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
        max_per_action_cents:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        total_budget_cents:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        expires_at:
          type: string
          format: date-time
          pattern: >-
            ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
        max_delegation_depth:
          type: integer
          minimum: 0
          maximum: 20
      required:
        - actions
        - supplier_ids
        - sku_ids
        - max_per_action_cents
        - total_budget_cents
        - expires_at
        - max_delegation_depth
      additionalProperties: false
      description: >-
        Every child must narrow every parent dimension, including expiration and delegation depth.
        Empty resource arrays permit nothing. Budgets are shared with ancestors, not independent
        pools. All money is integer USD cents.
      examples:
        - actions:
            - supplier.quote.request
            - supplier.purchase.execute
          supplier_ids:
            - supplier-co
          sku_ids:
            - PACK-500
          max_per_action_cents: 90000
          total_budget_cents: 90000
          expires_at: '2026-10-18T17:30:00Z'
          max_delegation_depth: 0
    ErrorCode:
      type: string
      enum:
        - INSUFFICIENT_SCOPE
        - OUTSIDE_PARENT_SCOPE
        - SELLER_POLICY_DENIED
        - GRANT_REVOKED
        - GRANT_EXPIRED
        - BUDGET_EXCEEDED
        - QUOTE_EXPIRED
        - INVALID_CALLER
        - INVALID_REQUEST
        - ALREADY_EXECUTED
        - SERVICE_UNAVAILABLE
    Error:
      type: object
      additionalProperties: false
      required:
        - status
        - code
        - reason
      properties:
        status:
          type: string
          enum:
            - AUTHORITY_REQUIRED
            - DENIED
            - ERROR
        code:
          $ref: '#/components/schemas/ErrorCode'
        reason:
          type: string
        next_action:
          type: string
          enum:
            - request_authority
            - retry
            - contact_owner
        required_scope:
          $ref: '#/components/schemas/AuthorityScope'
      examples:
        - status: AUTHORITY_REQUIRED
          code: INSUFFICIENT_SCOPE
          reason: Current grant does not permit purchases
          next_action: request_authority
          required_scope:
            actions:
              - supplier.quote.request
              - supplier.purchase.execute
            supplier_ids:
              - supplier-co
            sku_ids:
              - PACK-500
            max_per_action_cents: 90000
            total_budget_cents: 90000
            expires_at: '2026-10-18T17:30:00Z'
            max_delegation_depth: 0
        - status: DENIED
          code: SELLER_POLICY_DENIED
          reason: Supplier policy denied operation
          next_action: contact_owner
    ConsoleError:
      type: object
      additionalProperties: false
      required:
        - status
        - code
        - reason
      properties:
