        result: {}
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: integer
            message:
              type: string
            data: {}
      additionalProperties: true
      description: >-
        Transport envelope only. Use an MCP client for initialization, tools/list, tools/call and
        notifications; MCP tool arguments are not REST endpoints.
    OnboardingContextRequest:
      type: object
      properties: {}
      additionalProperties: false
    OnboardingContextData:
      type: object
      properties:
        account_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9:_-]*$
        organization:
          type: object
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
              pattern: ^[A-Za-z0-9][A-Za-z0-9:_-]*$
            name:
              type: string
              minLength: 1
              maxLength: 120
          required:
            - id
            - name
          additionalProperties: false
        connection:
          oneOf:
            - type: object
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: ^[A-Za-z0-9][A-Za-z0-9:_-]*$
                principal_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: ^[A-Za-z0-9][A-Za-z0-9:_-]*$
                state:
                  type: string
                  const: CONSENT_REQUIRED
                grant_id:
                  type: 'null'
                scope:
                  type: 'null'
              required:
                - id
                - principal_id
                - state
                - grant_id
                - scope
              additionalProperties: false
            - type: object
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: ^[A-Za-z0-9][A-Za-z0-9:_-]*$
                principal_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: ^[A-Za-z0-9][A-Za-z0-9:_-]*$
                state:
                  type: string
                  const: ACTIVE
                grant_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: ^[A-Za-z0-9][A-Za-z0-9:_-]*$
                scope:
                  type: object
                  properties:
                    actions:
                      type: array
