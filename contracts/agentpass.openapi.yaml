                          - supplier.quote.request
                          - supplier.purchase.execute
                          - supplier.margin.read
                    supplier_ids:
                      type: array
                      items:
                        type: string
                        minLength: 1
                    sku_ids:
                      type: array
                      items:
                        type: string
                        minLength: 1
                    max_per_action_cents:
