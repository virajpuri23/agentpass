          minLength: 1
          maxLength: 200
        supplier_id:
          type: string
          minLength: 1
          maxLength: 200
        sku_id:
          type: string
          minLength: 1
          maxLength: 200
        quantity:
          type: integer
          minimum: 1
        unit_price_cents:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        total_cents:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        currency:
          type: string
          const: USD
        expires_at:
          type: string
          format: date-time
    PurchaseReceipt:
      type: object
      additionalProperties: false
      required:
        - receipt_id
        - request_id
        - order_id
        - supplier_id
        - sku_id
        - quantity
        - amount_cents
        - currency
        - grant_id
        - outcome
        - simulated
      properties:
        receipt_id:
          type: string
          minLength: 1
          maxLength: 200
        request_id:
          type: string
          minLength: 1
          maxLength: 200
        order_id:
          type: string
          minLength: 1
          maxLength: 200
        supplier_id:
          type: string
          minLength: 1
          maxLength: 200
        sku_id:
          type: string
          minLength: 1
          maxLength: 200
        quantity:
          type: integer
          minimum: 1
        amount_cents:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        currency:
          type: string
          const: USD
        grant_id:
          type: string
          minLength: 1
          maxLength: 200
        outcome:
          type: string
          const: COMPLETED
        simulated:
          type: boolean
          const: true
      examples:
        - receipt_id: rec-001
          request_id: purchase-001
          order_id: order-001
          supplier_id: supplier-co
          sku_id: PACK-500
          quantity: 500
          amount_cents: 85000
          currency: USD
          grant_id: grant-purchase
          outcome: COMPLETED
          simulated: true
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - event_id
        - timestamp
        - principal_id
        - grant_id
        - action
        - decision
        - reason_code
        - request_id
        - trace_id
      properties:
        event_id:
          type: string
          minLength: 1
          maxLength: 200
        timestamp:
          type: string
          format: date-time
        principal_id:
          type: string
          minLength: 1
          maxLength: 200
        grant_id:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 200
            - type: 'null'
        action:
          type: string
        decision:
          type: string
        reason_code:
          anyOf:
            - $ref: '#/components/schemas/ErrorCode'
            - type: 'null'
        request_id:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 200
            - type: 'null'
        trace_id:
          type: string
          minLength: 1
          maxLength: 200
    RunList:
      type: object
      additionalProperties: false
      required: [runs, truncated, visibility]
      properties:
        runs:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [run_id, started_at, updated_at, event_count]
            properties:
              run_id: {type: string}
              started_at: {type: string, format: date-time}
              updated_at: {type: string, format: date-time}
              event_count:
                oneOf: [{type: integer}, {type: string, pattern: '^[0-9]+$'}]
        truncated: {type: boolean}
        visibility: {type: string, enum: [organization, caller_only]}
    ConsoleSnapshot:
      type: object
      additionalProperties: false
      required:
        - principal
        - grants
        - budgets
        - requests
        - activity
        - receipts
        - visibility
        - snapshot_at
      properties:
        run_id:
          type: string
          pattern: '^run-[a-zA-Z0-9_-]{1,80}$'
        principal:
          $ref: '#/components/schemas/Principal'
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
        budgets:
          type: array
          items:
            $ref: '#/components/schemas/GrantBudget'
        requests:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - requester_principal_id
              - parent_grant_id
              - requested_scope
              - reason
              - status
              - created_at
              - updated_at
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 200
              requester_principal_id:
                type: string
                minLength: 1
                maxLength: 200
              parent_grant_id:
                type: string
                minLength: 1
                maxLength: 200
              requested_scope:
                $ref: '#/components/schemas/AuthorityScope'
              offered_scope:
                $ref: '#/components/schemas/AuthorityScope'
              reason:
                type: string
              status:
                type: string
                enum:
                  - PENDING
                  - COUNTEROFFERED
                  - ACCEPTED
                  - REJECTED
                  - CANCELLED
              issued_grant_id:
                type: string
                minLength: 1
                maxLength: 200
              created_at:
                type: string
                format: date-time
              updated_at:
                type: string
                format: date-time
        activity:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
          maxItems: 500
          description: Console snapshots return at most 200 events; selected runs return at most 500.
        receipts:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseReceipt'
          maxItems: 100
        visibility:
          type: object
          additionalProperties: false
          required:
            - grants
            - descendants_complete
            - requests
            - activity
            - activity_truncated
            - receipts_truncated
          properties:
            grants:
              type: string
              enum:
                - organization
                - held_or_issued
            descendants_complete:
              type: boolean
            requests:
              type: string
              const: parties_only
            activity:
              type: string
              enum:
                - organization
                - caller_only
            activity_truncated:
              type: boolean
            receipts_truncated:
              type: boolean
        snapshot_at:
          type: string
          format: date-time
    SupplierIdentifier:
