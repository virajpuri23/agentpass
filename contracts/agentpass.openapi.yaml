                    ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
              required:
                - job_id
                - agent_id
                - claim_id
                - launch_id
                - template_id
                - task
                - grant_id
                - lease_expires_at
              additionalProperties: false
            - type: 'null'
      required:
        - job
      additionalProperties: false
    OnboardingRunnerCredentialRequest:
      type: object
      properties:
        claim_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9:_-]*$
      required:
        - claim_id
      additionalProperties: false
    OnboardingRunnerCredentialData:
      type: object
      properties:
        credential:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        mcp_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
          pattern: >-
            ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
      required:
        - credential
        - mcp_url
        - expires_at
      additionalProperties: false
    OnboardingRunnerHeartbeatRequest:
      type: object
      properties:
        claim_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9:_-]*$
      required:
        - claim_id
      additionalProperties: false
    OnboardingRunnerHeartbeatData:
      type: object
      properties:
        stop:
          type: boolean
        lease_expires_at:
          type: string
          format: date-time
          pattern: >-
            ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
      required:
        - stop
        - lease_expires_at
      additionalProperties: false
    OnboardingChildReadyRequest:
      type: object
      properties:
        claim_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9:_-]*$
      required:
        - claim_id
      additionalProperties: false
    OnboardingRunnerResultRequest:
      type: object
      properties:
        claim_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9:_-]*$
        outcome:
          type: string
          enum:
            - COMPLETED
            - FAILED
        summary:
          type: string
          maxLength: 2000
      required:
        - claim_id
        - outcome
        - summary
      additionalProperties: false
    RevokeAgentInput:
      type: object
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9:_-]*$
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - idempotency_key
        - reason
      additionalProperties: false
  responses:
    ApiError:
      description: >-
        Machine-readable denial or failure. AUTHORITY_REQUIRED/INSUFFICIENT_SCOPE is recoverable via
        request_authority. Retry uncertain execution with the identical idempotency key; never
        assume it failed before fulfillment.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConsoleError:
      description: Console or proxied authority failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConsoleError'
  parameters: {}
x-mcp-tools:
  legacy_service_tools:
    - list_runs
    - get_run
    - provision_child
    - describe_authority
    - get_my_grants
    - request_authority
    - get_authority_request
    - respond_authority_request
    - accept_authority_offer
    - delegate_authority
    - execute_action
    - revoke_authority
  remote_onboarding_tools:
    - get_onboarding_context
    - provision_agent
    - list_agents
    - get_agent
    - revoke_agent
    - revoke_connection
  description: >-
    Tool definitions are discovered with tools/list; there are no REST /tools endpoints.
    describe_authority is static discovery; get_my_grants uses /v1/me. Stdio retains the service tools, including read-only run inspection.
