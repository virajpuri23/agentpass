# AgentPass implemented HTTP contract. See contracts/README.md for scope and validation.
openapi: 3.1.0
info:
  title: AgentPass Product API
  version: 0.2.0
  description: >-
    Complete repository-owned HTTP surface: authority, self-service agents, private runner control,
    supplier service, browser consent, console and MCP transport. Schemas follow
    packages/contracts/src/index.ts and onboarding.ts plus implemented route validators; this
    document does not change those contracts. All orders and payments are simulated. Identity comes
    from authenticated credentials, never model-provided principal, organization or grant IDs. Root
    authority is seeded/admin-controlled; no public root-issuance endpoint exists.


    Servers are local defaults, not evidence of a hosted deployment. Authority and supplier REST
    services are private loopback services in an embedded MCP deployment. Onboarding, runner and
    browser routes are configuration-dependent; their presence here documents implementation, not
    completion of the hosted OAuth/worker gates. Browser routes use HTML/forms, not the JSON success
    envelope. Framework-managed OAuth discovery and upstream Supabase token/authorization APIs are
    outside this repository-owned contract. See contracts/README.md and
    docs/21-SELF-SERVICE-ROLLOUT.md.
servers:
  - url: http://localhost:4100
    description: Authority service; private in the embedded deployment. Override with AUTHORITY_URL.
security:
  - AgentBearer: []
  - HumanBearer: []
tags:
  - name: Health
    description: Liveness/storage checks; meaning varies by host.
  - name: Authority
    description: Authenticated grants, negotiation, protected actions and audit.
  - name: Agents
    description: Connection-owned self-service child lifecycle; requires configured agent control.
  - name: Runner
    description: Private trusted runtime only. Never expose credential delivery through tools or console.
  - name: Supplier
    description: Private server-to-server interface; supplier policy is independent of buyer grants.
  - name: Consent
    description: Trusted owner browser approval using PKCE, one-use cookies and CSRF.
  - name: Identity
    description: Configured Supabase OAuth sign-in UI. Provider consent does not issue AgentPass grants.
  - name: Console
    description: Optional same-origin browser console with bounded process-local sessions.
  - name: MCP
    description: Streamable HTTP transport. Tool contracts remain MCP tool definitions.
paths:
  /health:
    get:
      operationId: health
      summary: Check service health
      tags:
        - Health
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/ApiError'
      security: []
      servers:
        - url: http://localhost:4100
          description: Authority service; private in the embedded deployment. Override with AUTHORITY_URL.
        - url: http://localhost:4200
          description: >-
            Private supplier service; override with SUPPLIER_URL. Never expose service credentials
            to agents.
        - url: http://localhost:3001
          description: MCP app origin; override with the origin of MCP_PUBLIC_URL.
      description: >-
        Authority and supplier check storage. The Manufact app checks liveness only. The console
        host does not implement /health.
  /v1/me:
    get:
      operationId: getCaller
      summary: Inspect authenticated identity and held grants
      tags:
        - Authority
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    const: OK
                  data:
                    $ref: '#/components/schemas/Caller'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
      description: >-
        Only caller-held grants. Inspector budgets include ancestor reservations and debits; invalid
        chains have a null remaining budget.
  /v1/console:
    get:
      operationId: getConsoleSnapshot
      summary: Read a transactionally consistent authority console snapshot
      tags:
        - Authority
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    const: OK
                  data:
                    $ref: '#/components/schemas/ConsoleSnapshot'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
      description: >-
        Owners see organization grants/activity/receipts; others see held/issued grants and their
        own activity/receipts. Negotiations stay private to requester and parent even for owners.
        Returns at most 200 events and 100 receipts with truncation flags.
  /v1/runs:
    get:
      operationId: listRuns
      summary: Inspect persisted caller-visible run evidence
      tags: [Authority]
      description: >-
        Correlation IDs never confer authority. Caller and organization visibility are enforced.
        Events are historical; budgets and request states are current snapshots.
        Missing and inaccessible runs return the same error. See docs/22-RUN-INSPECTION.md.
      responses:
        '200':
          description: Persisted run evidence.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, data]
                properties:
                  status: {type: string, const: OK}
                  data:
                    $ref: '#/components/schemas/RunList'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /v1/runs/{run_id}:
    get:
      operationId: getRun
      summary: Inspect persisted caller-visible run evidence
      tags: [Authority]
      parameters:
        - in: path
          name: run_id
          required: true
          schema:
            type: string
            pattern: '^run-[a-zA-Z0-9_-]{1,80}$'
      description: >-
        Correlation IDs never confer authority. Caller and organization visibility are enforced.
        Events are historical; budgets and request states are current snapshots.
        Missing and inaccessible runs return the same error. See docs/22-RUN-INSPECTION.md.
      responses:
        '200':
          description: Persisted run evidence.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, data]
                properties:
                  status: {type: string, const: OK}
                  data:
                    $ref: '#/components/schemas/ConsoleSnapshot'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /console-api/runs:
    get:
      operationId: consoleListRuns
      summary: Inspect persisted caller-visible run evidence
      tags: [Console]
      security: [{ConsoleCookie: []}]
      servers:
        - url: http://localhost:3000
      description: >-
        Correlation IDs never confer authority. Caller and organization visibility are enforced.
        Events are historical; budgets and request states are current snapshots.
        Missing and inaccessible runs return the same error. See docs/22-RUN-INSPECTION.md.
      responses:
        '200':
          description: Persisted run evidence.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, data]
                properties:
                  status: {type: string, const: OK}
                  data:
                    $ref: '#/components/schemas/RunList'
        '400':
          $ref: '#/components/responses/ConsoleError'
        '401':
          $ref: '#/components/responses/ConsoleError'
        '403':
          $ref: '#/components/responses/ConsoleError'
        '404':
          $ref: '#/components/responses/ConsoleError'
        '503':
          $ref: '#/components/responses/ConsoleError'
  /console-api/runs/{run_id}:
    get:
      operationId: consoleGetRun
      summary: Inspect persisted caller-visible run evidence
      tags: [Console]
      security: [{ConsoleCookie: []}]
      servers:
        - url: http://localhost:3000
      parameters:
        - in: path
          name: run_id
          required: true
          schema:
            type: string
            pattern: '^run-[a-zA-Z0-9_-]{1,80}$'
      description: >-
        Correlation IDs never confer authority. Caller and organization visibility are enforced.
        Events are historical; budgets and request states are current snapshots.
        Missing and inaccessible runs return the same error. See docs/22-RUN-INSPECTION.md.
      responses:
        '200':
          description: Persisted run evidence.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, data]
                properties:
                  status: {type: string, const: OK}
                  data:
                    $ref: '#/components/schemas/ConsoleSnapshot'
        '400':
          $ref: '#/components/responses/ConsoleError'
        '401':
          $ref: '#/components/responses/ConsoleError'
        '403':
          $ref: '#/components/responses/ConsoleError'
        '404':
          $ref: '#/components/responses/ConsoleError'
        '503':
          $ref: '#/components/responses/ConsoleError'
  /v1/authority/requests:
    post:
      operationId: requestAuthority
      summary: Request additional scope from an existing parent
      tags:
        - Authority
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorityRequestInput'
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    const: OK
                  data:
                    $ref: '#/components/schemas/AuthorityRequestCreated'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
      description: >-
        Only an existing live delegated child may request. Creates a new request per call; this
        endpoint has no idempotency key. Requested scope may exceed the parent; the eventual
        offer/issuance must not.
      x-mcp-tool: request_authority
  /v1/authority/requests/{requestId}:
    get:
      operationId: getAuthorityRequest
      summary: Read a private authority negotiation
      tags:
        - Authority
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    const: OK
                  data:
                    $ref: '#/components/schemas/AuthorityRequest'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      x-mcp-tool: get_authority_request
  /v1/authority/requests/{requestId}/respond:
    post:
      operationId: respondAuthorityRequest
      summary: Counteroffer or reject as the authorized parent
      tags:
        - Authority
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorityResponseInput'
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    const: OK
                  data:
                    $ref: '#/components/schemas/AuthorityRequest'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      description: >-
        Only the live parent grant subject can respond to PENDING. COUNTEROFFER requires
        offered_scope, bounded by live parent and requested scope. Requesters cannot approve
        themselves. Non-pending state returns 409.
      x-mcp-tool: respond_authority_request
  /v1/authority/requests/{requestId}/accept:
    post:
      operationId: acceptAuthorityOffer
      summary: Accept an offer as its requesting child
      tags:
        - Authority
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdempotencyInput'
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    const: OK
                  data:
                    $ref: '#/components/schemas/Grant'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      description: >-
        Rechecks live authority before issuing. Repeated acceptance of an accepted request returns
        its same live grant; idempotency is bound to the request lifecycle. The required
        idempotency_key is validated but is not a separate server-side binding.
      x-mcp-tool: accept_authority_offer
  /v1/grants/{grantId}/delegate:
    post:
      operationId: delegateAuthority
      summary: Delegate a subset to an existing principal
      tags:
        - Authority
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelegateInput'
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    const: OK
                  data:
                    $ref: '#/components/schemas/Grant'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
      parameters:
        - name: grantId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      description: >-
        Authenticated parent subject only. The child cannot widen action, supplier, SKU, amount,
        expiry or depth. No independent budget pool is created. This endpoint has no idempotency
        key.
      x-mcp-tool: delegate_authority
  /v1/grants/{grantId}/provision-child:
    post:
      operationId: provisionChild
      summary: Create a credential-bound child and subset grant
      tags:
        - Authority
      security:
        - AgentBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionChildInput'
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    const: OK
                  data:
                    $ref: '#/components/schemas/ProvisionedChild'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
      parameters:
        - name: grantId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      description: >-
        Service-agent bearer only. Human OAuth connections must use POST /v1/agents and receive
        this legacy path returns 403 with next_action contact_owner and a reason directing the caller
        to provision_agent. The trusted runtime generates
        and retains the child secret, then submits only its verifier. New child is fixed
        AGENT/SERVICE in the parent organization. Atomic creation with idempotency scoped to parent
        and exact input; changed input returns 409 ALREADY_EXECUTED. No credential or verifier is
        returned.
      x-mcp-tool: provision_child
  /v1/grants/{grantId}/revoke:
    post:
      operationId: revokeAuthority
      summary: Revoke a grant as issuer or organization owner
      tags:
        - Authority
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeGrantInput'
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    const: OK
                  data:
                    $ref: '#/components/schemas/GrantRevocation'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
      parameters:
        - name: grantId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      description: >-
        Idempotently preserves the first revoked_at. Subsequent descendant checks fail. Reason is
        required input; this response is the revocation timestamp, not a purchase receipt.
      x-mcp-tool: revoke_authority
  /v1/actions/execute:
    post:
      operationId: executeAction
      summary: Request a quote or execute a simulated purchase
      tags:
        - Authority
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteActionInput'
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    const: OK
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/SupplierQuote'
                      - $ref: '#/components/schemas/PurchaseReceipt'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
      description: >-
        Rechecks caller/grant chain and independent supplier policy. Purchase price and quantity
        come from the trusted quote. Reservations and debits apply atomically to all ancestors.
        Purchase idempotency is scoped to authenticated principal and exact operation input.
        Optional purchase quantity must match the quote. Quote calls create a new quote per call;
        their required key does not deduplicate quote creation. Reuse the same key after an
        uncertain supplier outcome. supplier.margin.read always denies; no supplier-private
        cost/margin fields are returned.
      x-mcp-tool: execute_action
  /v1/audit:
    get:
      operationId: getAudit
      summary: Read chronological audit events as organization owner
      tags:
        - Authority
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    const: OK
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
      description: OWNER only, organization-scoped. No filtering parameters are currently implemented.
  /v1/onboarding/context:
    get:
      operationId: getOnboardingContext
      summary: Inspect verified human connection and consent state
      tags:
        - Agents
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    const: OK
                  data:
                    $ref: '#/components/schemas/OnboardingContextData'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
      security:
        - HumanBearer: []
      description: >-
        Requires configured human OAuth verification. No model-selected account, workspace or
        client. CONSENT_REQUIRED has null grant/scope; ACTIVE has both.
      x-mcp-tool: get_onboarding_context
  /v1/onboarding/connection/revoke:
    post:
      operationId: revokeConnection
      summary: Revoke the authenticated human connection
      tags:
        - Agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRevokeConnectionRequest'
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    const: OK
                  data:
                    $ref: '#/components/schemas/OnboardingRevokeConnectionData'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
      security:
        - HumanBearer: []
      description: >-
        Connection ID is derived from verified OAuth. Revocation is transactional and blocks
        descendant authority before private cleanup.
      x-mcp-tool: revoke_connection
  /v1/agents:
    post:
      operationId: provisionAgent
      summary: Provision a bounded child for a consented connection
      tags:
        - Agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingProvisionRequest'
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    const: OK
                  data:
                    $ref: '#/components/schemas/OnboardingAgentData'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Never cache private runner or managed-agent responses.
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/ApiError'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
